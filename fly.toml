# Fly.io config for the Church Manager.
# 1. Install flyctl: https://fly.io/docs/hands-on/install-flyctl/
# 2. flyctl auth login
# 3. flyctl launch --copy-config --no-deploy   (accept the existing fly.toml)
# 4. flyctl volumes create church_data --size 1 --region <your-region>
# 5. flyctl secrets set DATABASE_URL='postgresql://...'
# 6. flyctl secrets set SESSION_SECRET=$(openssl rand -hex 32)
# 7. flyctl deploy

app = "church-management-system"
primary_region = "lhr"

[build]

[env]
  NODE_ENV   = "production"
  PORT       = "3000"
  PHOTO_DIR  = "/data/photos"
  LOGO_DIR   = "/data/church-logos"
  BACKUP_DIR = "/data/backups/postgres"
  BACKUP_KEEP_DAYS = "30"
  BACKUP_HOUR_UTC = "2"
  BACKUP_MINUTE_UTC = "17"
  BACKUP_RUN_ON_START = "1"

[mounts]
  source      = "church_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https   = true
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"
    method = "get"
    path = "/healthz"

  [[http_service.checks]]
    interval = "30s"
    timeout = "3s"
    grace_period = "25s"
    method = "get"
    path = "/readyz"

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "256mb"
