# Fly.io config for the Church Manager.
# 1. Install flyctl: https://fly.io/docs/hands-on/install-flyctl/
# 2. flyctl auth login
# 3. flyctl launch --copy-config --no-deploy   (accept the existing fly.toml)
# 4. flyctl volumes create church_data --size 1 --region <your-region>
# 5. flyctl secrets set DATABASE_URL='postgresql://...'
# 6. flyctl secrets set SESSION_SECRET=$(openssl rand -hex 32)
# 7. flyctl deploy

app = "church-management-system"
primary_region = "lhr"

[build]

[env]
  NODE_ENV   = "production"
  PORT       = "3000"
  # lib/database-url.js rewrites DATABASE_URL to sslmode=verify-full, and
  # lib/operations-scheduler.js hands that same env to scripts/pg-backup.sh.
  # Node's Prisma and pg clients carry their own CA bundles, but libpq
  # (pg_dump) does not -- without this it looks for ~/.postgresql/root.crt,
  # finds nothing, and every scheduled backup fails to connect.
  PGSSLROOTCERT = "/etc/ssl/certs/ca-certificates.crt"
  PHOTO_DIR  = "/data/photos"
  LOGO_DIR   = "/data/church-logos"
  BACKUP_DIR = "/data/backups/postgres"
  BACKUP_KEEP_DAYS = "30"
  BACKUP_HOUR_UTC = "2"
  BACKUP_MINUTE_UTC = "17"
  BACKUP_RUN_ON_START = "1"

[mounts]
  source      = "church_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https   = true
  # Kept always-on ON PURPOSE, despite the compute-quota incident above.
  #
  # lib/operations-scheduler.js runs the nightly pg_backup from an in-process
  # timer (BACKUP_HOUR_UTC), so a stopped machine is a skipped backup. Letting
  # this scale to zero would trade the church's backups for compute we do not
  # actually need to save: an idle machine costs the database nothing, because
  # Neon suspends on query inactivity, not on whether a client is running.
  # Removing the /readyz poll below is what lets it sleep.
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 1

  # Liveness only. /healthz answers from the process and touches no database,
  # which is the whole point of checking it on a timer.
  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"
    method = "get"
    path = "/healthz"

  # DELIBERATELY NOT CHECKING /readyz.
  #
  # /readyz runs `SELECT 1` against Postgres. Fly polled it every 30 seconds,
  # forever, which is an accidental keep-alive: Neon scales to zero after five
  # minutes of inactivity, so a query every thirty seconds means the compute
  # never once slept. That burned 440 compute-hours against a 100-hour monthly
  # allowance and took the database offline mid-August 2026, along with every
  # other project sharing the plan.
  #
  # It was also the wrong signal even ignoring cost. Tying machine health to an
  # external database means that whenever Neon is merely asleep or waking,
  # /readyz returns 503, Fly concludes the machine is unhealthy, and it gets
  # restarted — turning a routine cold start into a restart loop.
  #
  # The endpoint still exists and is worth curling by hand when diagnosing a
  # connectivity problem. It just must not be on a timer.

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "256mb"
