name: css

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: css-${{ github.ref }}
  cancel-in-progress: true

jobs:
  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need the base commit to render "before"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      # Dead-rule guard. styles.css spent nine generations accumulating rules
      # for markup that no longer exists; this reports how much has come back.
      - name: Unreferenced selectors
        run: node scripts/find-unused-css.js

      # Both stylesheets must parse. A stray brace in a hand-edited sheet is
      # otherwise invisible until a page renders unstyled in production.
      - name: Stylesheets parse
        run: |
          node -e '
            const fs = require("fs");
            let bad = false;
            for (const f of ["public/styles.css", "public/theme-ios26.css"]) {
              const css = fs.readFileSync(f, "utf8").replace(/\/\*[\s\S]*?\*\//g, "");
              let depth = 0, unmatched = 0;
              for (const ch of css) {
                if (ch === "{") depth++;
                else if (ch === "}") { depth--; if (depth < 0) unmatched++; }
              }
              const ok = depth === 0 && unmatched === 0;
              console.log(`${f}: depth=${depth} unmatched=${unmatched} ${ok ? "OK" : "BROKEN"}`);
              if (!ok) bad = true;
            }
            process.exit(bad ? 1 : 0);
          '

      # What actually changed on screen, relative to the base commit. This is
      # reported, not enforced: a stylesheet edit is SUPPOSED to change how
      # things look. The value is seeing the blast radius — an edit meant for
      # one page showing up on four others is the thing worth catching.
      - name: Rendered diff vs base
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          # Pick something to compare against. github.event.before is all
          # zeros on the first push of a new branch — which is precisely when
          # the comparison is most useful — so fall back to where this branch
          # left main rather than skipping.
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git merge-base HEAD origin/main 2>/dev/null || true)"
            echo "No push base; using merge-base with origin/main: ${BASE:-<none>}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "$(git rev-parse HEAD)" ]; then
            echo "Nothing to compare against — skipping."
            exit 0
          fi
          echo "Comparing against $BASE"

          # Hold the markup constant and vary only the stylesheets, so what the
          # diff reports is the effect of the CSS and nothing else. The tree
          # stays on HEAD throughout; only public/*.css is swapped for the
          # base commit's copy.
          #
          # The earlier approach checked out the base tree and copied this
          # commit's scripts over it, which broke as soon as one of those
          # scripts gained a dependency the base commit did not have — and it
          # also conflated markup changes with CSS changes, which is not what
          # a check named "css" should measure.
          node scripts/css-snapshot.js /tmp/after.json

          mkdir -p /tmp/css-head
          for f in styles.css theme-ios26.css; do
            cp "public/$f" "/tmp/css-head/$f"
            if git cat-file -e "$BASE:public/$f" 2>/dev/null; then
              git show "$BASE:public/$f" > "public/$f"
            else
              echo "public/$f did not exist at base — comparing against an empty sheet"
              : > "public/$f"
            fi
          done

          node scripts/css-snapshot.js /tmp/before.json
          for f in styles.css theme-ios26.css; do cp "/tmp/css-head/$f" "public/$f"; done

          {
            echo '## Rendered CSS diff vs base'
            echo
            echo '```'
            node scripts/css-diff.js /tmp/before.json /tmp/after.json --max 40
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
