name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  fly:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

      - name: Health check
        env:
          BASE_URL: https://church-management-system.fly.dev
        run: |
          set -e
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 10 "${BASE_URL}/healthz" >/dev/null; then
              echo "healthz: OK"; break
            fi
            echo "healthz attempt ${i} failed, retrying..."; sleep 5
          done
          curl -fsS --max-time 10 "${BASE_URL}/readyz" >/dev/null && echo "readyz: OK"

      - name: Verify public auth surfaces
        env:
          BASE_URL: https://church-management-system.fly.dev
        run: |
          curl -fsS --max-time 10 "${BASE_URL}/" >/dev/null
          curl -fsS --max-time 10 "${BASE_URL}/login" >/dev/null
          curl -fsS --max-time 10 "${BASE_URL}/signup" >/dev/null
